[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind-ai"
version = "0.1.0"
description = "Ask Your Data Anything — secure natural-language SQL analytics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QueryMind AI Contributors" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<3",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "sqlglot>=26,<28",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.41,<2",
  "plotly>=5.24,<7",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = ["postgres: optional PostgreSQL integration test"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
