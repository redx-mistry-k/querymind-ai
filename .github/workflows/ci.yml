name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q backend frontend scripts run.py
      - name: Test
        run: python -m pytest
